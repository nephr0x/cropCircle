<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F6F2">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>FarmLine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- design tokens ---------- */
:root{
  color-scheme:light;
  --bg:#F7F6F2; --bg-2:#EFEEE8; --surface:#FFFFFF; --ink:#252824; --muted:#777A73; --muted-2:#63665F;
  --border:#E5E3DC; --border-2:#D5D2C8;
  --sage:#66866C; --forest:#304F3B; --forest-2:#27412F; --on-forest:#FFFFFF;
  --sage-soft:#E9EFE9; --sage-line:#CEDBCF;
  --danger:#A4492F; --danger-soft:#F7EAE5;
  --shadow-1:0 1px 2px rgba(37,40,36,.05);
  --shadow-2:0 10px 30px -14px rgba(37,40,36,.22), 0 2px 6px -2px rgba(37,40,36,.06);
  --r-s:6px; --r:8px; --r-l:12px;
  --ease:cubic-bezier(.22,.8,.24,1);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#151815; --bg-2:#1C201C; --surface:#202521; --ink:#ECEEE8; --muted:#9BA097; --muted-2:#AEB3AA;
  --border:#2D342E; --border-2:#3B443C;
  --sage:#8FB096; --forest:#4C7A5B; --forest-2:#588B68; --on-forest:#FFFFFF;
  --sage-soft:#253129; --sage-line:#34473A;
  --danger:#E59C84; --danger-soft:#3A251E;
  --shadow-1:0 1px 2px rgba(0,0,0,.3);
  --shadow-2:0 14px 34px -14px rgba(0,0,0,.6), 0 2px 6px -2px rgba(0,0,0,.3);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.6 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p{margin:0}
h1{font-size:28px;line-height:1.18;font-weight:700;letter-spacing:-.025em}
h2{font-size:16.5px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
h3{font-size:15.5px;line-height:1.4;font-weight:600}
a{color:var(--forest);text-underline-offset:3px;text-decoration-thickness:1px;text-decoration-color:var(--sage-line);transition:text-decoration-color .2s}
:root[data-theme=dark] a{color:var(--sage)}
a:hover{text-decoration-color:currentColor}
button{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px;border-radius:4px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.small{font-size:13.5px;line-height:1.5;color:var(--muted-2)}
.cap::first-letter{text-transform:uppercase}
.pre{white-space:pre-line}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.page.enter>*{animation:rise .45s var(--ease) backwards}
.page.enter>*:nth-child(2){animation-delay:.05s}.page.enter>*:nth-child(3){animation-delay:.1s}
.page.enter>*:nth-child(4){animation-delay:.15s}.page.enter>*:nth-child(n+5){animation-delay:.2s}
.stagger>*{animation:rise .4s var(--ease) backwards}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}
.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(n+6){animation-delay:.25s}
.swap{animation:fade .35s ease backwards}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--forest);
  background:var(--forest);color:var(--on-forest);font:600 14.5px/1 var(--font);letter-spacing:-.005em;cursor:pointer;text-decoration:none;white-space:nowrap;
  transition:background .18s,border-color .18s,box-shadow .18s,transform .12s var(--ease),color .18s}
.btn:hover:not(:disabled){background:var(--forest-2);border-color:var(--forest-2);box-shadow:var(--shadow-2)}
.btn:active:not(:disabled){transform:scale(.975)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--border-2)}
.btn.ghost:hover:not(:disabled){background:var(--bg-2);border-color:var(--border-2);box-shadow:none}
.btn.quiet{background:none;border-color:transparent;color:var(--forest);padding:0 10px}
:root[data-theme=dark] .btn.quiet{color:var(--sage)}
.btn.quiet:hover:not(:disabled){background:var(--sage-soft);border-color:transparent;box-shadow:none}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}
.btn.lg{min-height:46px;padding:0 22px;font-size:15.5px}
.btn.live,.btn.live:hover:not(:disabled){background:var(--danger);border-color:var(--danger);color:#fff}
.btn.busy{position:relative;color:transparent!important}
.btn.busy::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid var(--on-forest);border-right-color:transparent;animation:spin .7s linear infinite}
.btn.ghost.busy::after,.btn.quiet.busy::after{border-color:var(--muted);border-right-color:transparent}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btns.end{justify-content:flex-end}
.linkbtn{font:inherit;font-weight:600;color:var(--forest);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--sage-line)}
:root[data-theme=dark] .linkbtn{color:var(--sage)}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;transition:border-color .2s,transform .12s}
.iconbtn:hover{border-color:var(--border-2)}.iconbtn:active{transform:scale(.95)}

/* ---------- forms ---------- */
.field{margin-bottom:16px;min-width:0}
.field>label,.field-top>label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px;color:var(--ink)}
.field label small{color:var(--muted);font-weight:500;font-size:12.5px;margin-left:4px}
.field-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.field-top>label{margin:0}
input,textarea,.sel-btn{width:100%;font:400 15px/1.4 var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r);padding:10px 12px;
  transition:border-color .18s,box-shadow .18s,background .18s}
input{height:42px}
textarea{min-height:120px;resize:vertical;line-height:1.55}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
input:hover,textarea:hover,.sel-btn:hover{border-color:var(--muted)}
input:focus,textarea:focus,.sel-btn:focus-visible,.sel.open .sel-btn{outline:0;border-color:var(--sage);box-shadow:0 0 0 3px color-mix(in srgb,var(--sage) 22%,transparent)}
textarea[readonly]{background:var(--bg);color:var(--muted-2)}
.field.bad input,.field.bad textarea{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 16%,transparent)}
.field-err{color:var(--danger);font-size:13px;font-weight:500;margin-top:5px;animation:rise .25s var(--ease)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:0 14px}
.grid3.even{grid-template-columns:repeat(3,1fr)}
@media (max-width:640px){.grid2,.grid3,.grid3.even{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;margin:2px 0 18px;font-size:14.5px;cursor:pointer}
.check input{appearance:none;flex:none;width:18px;height:18px;margin:2px 0 0;padding:0;border-radius:5px;border:1px solid var(--border-2);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.check input::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform .18s var(--ease)}
.check input:checked{background:var(--forest);border-color:var(--forest)}
.check input:checked::after{transform:rotate(-45deg) scale(1)}
.form-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:4px}
/* custom select: animated menu over a real <select>, so forms keep working */
.sel{position:relative}
.sel select{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none}
.sel-btn{height:42px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer}
.sel-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-btn .ic{color:var(--muted);transition:transform .25s var(--ease)}
.sel.open .sel-btn .ic{transform:rotate(180deg)}
.sel-list{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 6px);margin:0;padding:5px;list-style:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:var(--shadow-2);
  max-height:260px;overflow:auto;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top;transition:opacity .16s,transform .2s var(--ease),visibility 0s .2s}
.sel.open .sel-list{opacity:1;visibility:visible;transform:none;transition:opacity .16s,transform .2s var(--ease)}
.sel-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:var(--r-s);font-size:14.5px;cursor:pointer}
.sel-list li.act{background:var(--bg-2)}
.sel-list li[aria-selected=true]{font-weight:600;color:var(--forest)}
:root[data-theme=dark] .sel-list li[aria-selected=true]{color:var(--sage)}
.sel-list li .ic{width:16px;height:16px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);padding:22px 24px;box-shadow:var(--shadow-1)}
.card.pad0{padding:0}
.card.hover{transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.card.hover:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:var(--border-2)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.cols.wide-left{grid-template-columns:minmax(0,5fr) minmax(0,4fr)}
@media (max-width:920px){.cols,.cols.wide-left{grid-template-columns:1fr}}
.page-head{margin-bottom:24px}
.page-head p{color:var(--muted);margin-top:8px;max-width:62ch}
.page-head.row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.error{display:flex;gap:10px;align-items:flex-start;background:var(--danger-soft);color:var(--danger);border-radius:var(--r);padding:10px 12px;margin-bottom:14px;font-weight:500;font-size:14.5px;animation:rise .3s var(--ease)}
.note-ok{display:inline-flex;align-items:center;gap:8px;color:var(--forest);font-weight:600;font-size:14.5px;animation:rise .3s var(--ease)}
:root[data-theme=dark] .note-ok{color:var(--sage)}
.alert{color:var(--danger);font-weight:600}
.sub{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.quote{border-left:2px solid var(--sage-line);padding-left:14px;color:var(--muted-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.tags li{background:var(--sage-soft);border:1px solid var(--sage-line);border-radius:999px;padding:3px 11px;color:var(--forest);font-weight:600;font-size:13px;line-height:1.5}
:root[data-theme=dark] .tags li{color:var(--sage)}
.tags li::first-letter{text-transform:uppercase}
.tags li.hot,.tags li.good{background:var(--forest);border-color:var(--forest);color:var(--on-forest)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--muted-2);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.chip.live{background:var(--sage-soft);border-color:var(--sage-line);color:var(--forest)}
:root[data-theme=dark] .chip.live{color:var(--sage)}
.chip.live .dot{background:var(--sage)}
.chip .spin,.jump-state.busy{width:11px;height:11px;border-radius:50%;border:1.6px solid var(--sage);border-right-color:transparent;animation:spin .8s linear infinite}
.count{min-width:22px;padding:0 7px;border-radius:999px;background:var(--bg-2);color:var(--muted-2);font-size:12.5px;font-weight:700;line-height:22px;text-align:center}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--forest);color:var(--on-forest);font-size:11.5px;font-weight:700;line-height:18px;text-align:center}
.sk{height:11px;border-radius:6px;margin:12px 0;background:linear-gradient(90deg,var(--bg-2) 30%,var(--border) 50%,var(--bg-2) 70%);background-size:200% 100%;animation:shimmer 1.5s linear infinite}
.sk.w80{width:80%}.sk.w60{width:60%}.sk.w40{width:40%}.sk.tall{height:20px;width:35%;margin-bottom:20px}
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;z-index:50;bottom:calc(100% + 8px);right:0;width:max-content;max-width:280px;white-space:normal;text-align:left;
  background:var(--ink);color:var(--bg);font:500 12.5px/1.45 var(--font);padding:7px 10px;border-radius:var(--r);opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .16s,transform .18s var(--ease),visibility 0s .18s;pointer-events:none}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;visibility:visible;transform:none;transition:opacity .16s .25s,transform .18s var(--ease) .25s}
[data-tip].tip-left::after{right:auto;left:0}
[data-tip].tip-down::after{bottom:auto;top:calc(100% + 8px);transform:translateY(-4px)}
[data-tip].tip-down:hover::after,[data-tip].tip-down:focus-visible::after{transform:none}
.empty{text-align:center;padding:40px 20px}
.empty .empty-ic{width:44px;height:44px;border-radius:50%;background:var(--sage-soft);color:var(--forest);display:grid;place-items:center;margin:0 auto 14px}
:root[data-theme=dark] .empty .empty-ic{color:var(--sage)}
.empty p{color:var(--muted);max-width:44ch;margin:6px auto 16px}

/* list rows inside cards */
.item{padding:18px 0;border-top:1px solid var(--border)}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.item>p{margin-top:8px}
.item h3 a{color:inherit}
.meta{color:var(--muted-2);font-size:13.5px;margin-top:3px}
.kv{margin-top:8px}.kv strong{font-weight:600}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:0 0 14px 40px;counter-increment:s}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--sage-soft);color:var(--forest);font-weight:700;font-size:13px;display:grid;place-items:center}
:root[data-theme=dark] .steps li::before{color:var(--sage)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:12.5px;top:30px;bottom:4px;width:1px;background:var(--border)}
.foot{color:var(--muted-2);font-size:13px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.reveal{animation:rise .3s var(--ease);margin-top:12px}

/* collapsible sections */
.fold-head{width:100%;display:flex;align-items:center;gap:12px;padding:16px 20px;background:none;border:0;border-radius:var(--r-l);color:inherit;text-align:left;cursor:pointer;font:inherit}
.fold-head:hover .chev{color:var(--ink)}
.fold-ic{width:32px;height:32px;border-radius:var(--r);background:var(--sage-soft);color:var(--forest);display:grid;place-items:center;flex:none}
:root[data-theme=dark] .fold-ic{color:var(--sage)}
.fold-title{flex:1;min-width:0}
.fold-sub{display:block;color:var(--muted-2);font-size:13.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-edit{font-size:13.5px;font-weight:600;color:var(--forest)}
:root[data-theme=dark] .fold-edit{color:var(--sage)}
.fold.open .fold-edit{display:none}
.chev{color:var(--muted);transition:transform .3s var(--ease),color .2s}
.fold.open>.fold-head .chev{transform:rotate(180deg)}
.fold-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s var(--ease)}
.fold.open>.fold-body{grid-template-rows:1fr}
.fold-body>.fold-in{min-height:0;overflow:hidden;padding:0 20px;opacity:0;transition:opacity .25s,padding .34s var(--ease)}
.fold.open>.fold-body>.fold-in{opacity:1;padding:4px 20px 22px}
@media (max-width:640px){.fold-head{padding:14px 16px}.fold-body>.fold-in{padding:0 16px}.fold.open>.fold-body>.fold-in{padding:4px 16px 18px}.card{padding:18px 16px}.fold-head .status .chip{display:none}}

/* ---------- sign in ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.auth-art{position:relative;overflow:hidden;background:#2B4634;color:#F3F2EC;padding:44px 48px;display:flex;flex-direction:column;justify-content:space-between}
.auth-art .brand{color:#F3F2EC}
.auth-art .brand .mark{background:#F3F2EC;color:#2B4634}
.auth-art h1{font-size:clamp(30px,3.4vw,46px);line-height:1.08;letter-spacing:-.035em;max-width:12ch;font-weight:600;position:relative}
.auth-art p{color:#C9D6CB;max-width:34ch;margin-top:16px;position:relative}
.auth-art .rows{position:absolute;left:-8%;right:-8%;bottom:-2%;width:116%;height:64%;opacity:.42;-webkit-mask-image:linear-gradient(to bottom,#000 10%,transparent 62%);mask-image:linear-gradient(to bottom,#000 10%,transparent 62%)}
.auth-main{display:grid;place-items:center;padding:40px 20px;position:relative}
.auth-box{width:100%;max-width:404px;animation:rise .5s var(--ease) backwards}
.auth-box h2{font-size:24px;letter-spacing:-.02em;margin-bottom:6px}
.auth-box .lede{color:var(--muted);margin-bottom:22px}
.auth-corner{position:absolute;top:20px;right:20px}
.brand.auth-brand{display:none;margin-bottom:28px}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;background:var(--bg-2);border-radius:10px;margin-bottom:22px}
.seg button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;font:600 14px var(--font);padding:8px 10px;border:0;border-radius:7px;background:none;color:var(--muted-2);cursor:pointer;transition:color .2s}
.seg button[aria-pressed=true]{color:var(--ink)}
.seg-thumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:7px;background:var(--surface);box-shadow:var(--shadow-1),0 0 0 1px var(--border);transition:transform .32s var(--ease),width .32s var(--ease)}
.switch{margin-top:18px;font-size:14.5px;color:var(--muted)}
.demo{font-size:13.5px;color:var(--muted-2);margin-top:22px;padding:12px 14px;border-radius:var(--r);background:var(--bg-2)}
@media (max-width:860px){.auth{grid-template-columns:1fr}.auth-art{display:none}.brand.auth-brand{display:flex}}

/* ---------- app shell ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.3) blur(12px);-webkit-backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--border)}
.top-in{max-width:1200px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:26px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.02em;color:var(--ink)}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--forest);color:#fff;display:grid;place-items:center}
.brand .mark .ic{width:17px;height:17px;stroke-width:2}
.tabs{position:relative;display:flex;align-self:stretch;gap:2px;flex:1;min-width:0}
.tab{position:relative;display:flex;align-items:center;gap:8px;padding:0 12px;border:0;background:none;font:600 14.5px var(--font);color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .2s}
.tab::before{content:"";position:absolute;inset:11px 2px;border-radius:var(--r);background:var(--bg-2);opacity:0;transform:scale(.96);transition:opacity .2s,transform .25s var(--ease)}
.tab:hover::before{opacity:1;transform:none}
.tab>*{position:relative}
.tab:hover,.tab[aria-current=page]{color:var(--ink)}
.tab[aria-current=page] .ic{color:var(--sage)}
.tab-ink{position:absolute;left:0;bottom:-1px;height:2px;width:0;border-radius:2px;background:var(--forest);transition:transform .38s var(--ease),width .38s var(--ease),opacity .2s;pointer-events:none}
:root[data-theme=dark] .tab-ink{background:var(--sage)}
.top-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.callus{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--muted-2);white-space:nowrap;text-decoration:none;padding:6px 10px;border-radius:999px;border:1px solid var(--border)}
.callus:hover{border-color:var(--border-2);color:var(--ink)}
.acct{position:relative}
.acct-btn{display:flex;align-items:center;gap:9px;padding:4px 8px 4px 4px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font:600 14px var(--font);cursor:pointer;transition:border-color .2s,box-shadow .2s}
.acct-btn:hover,.acct.open .acct-btn{border-color:var(--border-2);box-shadow:var(--shadow-1)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--sage-soft);color:var(--forest);display:grid;place-items:center;font-size:12.5px;font-weight:700;letter-spacing:.01em}
:root[data-theme=dark] .avatar{color:var(--sage)}
.acct-btn .ic{width:15px;height:15px;color:var(--muted);transition:transform .25s var(--ease)}
.acct.open .acct-btn .ic{transform:rotate(180deg)}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:256px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:var(--shadow-2);
  opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .16s,transform .22s var(--ease),visibility 0s .22s}
.acct.open .menu{opacity:1;visibility:visible;transform:none;transition:opacity .16s,transform .22s var(--ease)}
.menu-who{padding:10px 10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.menu-who strong{display:block;font-weight:600}
.menu-item{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:var(--r-s);background:none;color:var(--ink);font:500 14.5px var(--font);text-align:left;cursor:pointer}
.menu-item:hover{background:var(--bg-2)}
.menu-item .ic{color:var(--muted)}
.menu-item .toggle{margin-left:auto}
.toggle{width:34px;height:20px;border-radius:999px;background:var(--border-2);position:relative;transition:background .25s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .28s var(--ease)}
:root[data-theme=dark] .toggle{background:var(--forest)}
:root[data-theme=dark] .toggle::after{transform:translateX(14px)}
.main{max-width:1200px;margin:0 auto;padding:36px 24px 96px}
.dock{display:none}
@media (max-width:820px){
  .top-in{padding:0 16px;height:56px}
  .tabs,.acct-name,.callus span{display:none}
  .callus{padding:8px}
  .main{padding:24px 16px 120px}
  h1{font-size:24px}
  .dock{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .dock button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;border:0;border-radius:var(--r);background:none;color:var(--muted);font:600 11.5px var(--font);cursor:pointer;transition:color .2s,background .2s}
  .dock button[aria-current=page]{color:var(--forest);background:var(--sage-soft)}
  :root[data-theme=dark] .dock button[aria-current=page]{color:var(--sage)}
  .dock .ic{width:20px;height:20px}
  .dock .badge{position:absolute;top:2px;left:calc(50% + 6px)}
}

/* ---------- find help: results ---------- */
.results{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px;align-items:start;margin-top:28px;scroll-margin-top:76px}
.results-main{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.results section{scroll-margin-top:76px}
.hero{padding:24px 26px}
.sum{font-size:19px;line-height:1.5;letter-spacing:-.012em;margin:12px 0 16px;max-width:66ch;font-weight:500}
.hero-send{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--border)}
.hero-send>strong{font-weight:600;font-size:14.5px;margin-right:4px}
.jump{position:sticky;top:84px;display:grid;gap:2px}
.jump-title{font-size:13px;font-weight:700;color:var(--muted-2);padding:0 10px 8px}
.jump button{display:flex;align-items:center;gap:10px;padding:7px 10px;border:0;border-radius:var(--r);background:none;color:var(--muted-2);font:500 13.5px/1.35 var(--font);text-align:left;cursor:pointer;transition:background .2s,color .2s}
.jump button:hover{background:var(--bg-2);color:var(--ink)}
.jump-state{flex:none;width:7px;height:7px;border-radius:50%;background:var(--border-2);transition:background .3s}
.jump-state.live,.jump-state.done{background:var(--sage)}
.jump-state.saved{background:var(--muted)}
.jump-tools{display:flex;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.jump-tools button{font-size:12.5px;font-weight:600;padding:6px 8px}
@media (max-width:1040px){.results{grid-template-columns:minmax(0,1fr)}.jump{display:none}}

/* ---------- messages, filters ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.toolbar .seg{margin:0;min-width:240px}
.search{position:relative;flex:1;min-width:200px;max-width:340px;margin-left:auto}
.search .ic{position:absolute;left:12px;top:12px;color:var(--muted)}
.search input{padding-left:38px}
.msg{border-top:1px solid var(--border)}
.msg:first-child{border-top:0}
.msg-head{width:100%;display:flex;align-items:center;gap:14px;padding:14px 20px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background .2s}
.msg-head:hover{background:var(--bg)}
.msg-main{flex:1;min-width:0}
.msg-main strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-main strong::first-letter{text-transform:uppercase}
#msgList{overflow:hidden}
.msg-main span{display:block;color:var(--muted-2);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-date{color:var(--muted-2);font-size:13px;white-space:nowrap}
.msg .fold-body>.fold-in{padding:0 20px}
.msg.open .fold-body>.fold-in{padding:0 20px 18px}
.msg.open>.msg-head .chev{transform:rotate(180deg)}
.msg.open>.fold-body{grid-template-rows:1fr}
.msg.open>.fold-body>.fold-in{opacity:1}
.reply-box{border:1px solid var(--border);border-left:2px solid var(--sage);border-radius:var(--r);padding:12px 14px;margin-top:10px;background:var(--bg)}
.case-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 16px}

/* ---------- toasts and dialog ---------- */
#toasts{position:fixed;z-index:80;right:20px;bottom:20px;display:grid;gap:8px;justify-items:end;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:min(380px,calc(100vw - 32px));background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:var(--r-l);font-size:14px;font-weight:500;box-shadow:var(--shadow-2);
  opacity:0;transform:translateY(10px) scale(.98);transition:opacity .25s,transform .3s var(--ease)}
.toast.in{opacity:1;transform:none}
.toast .ic{color:#A9C8AF}
.toast.error .ic{color:#F0A68E}
@media (max-width:820px){#toasts{left:16px;right:16px;bottom:84px;justify-items:center}}
dialog{border:1px solid var(--border);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-2);width:min(420px,calc(100vw - 32px))}
dialog[open]{animation:pop .26s var(--ease)}
dialog::backdrop{background:rgba(26,30,26,.38);backdrop-filter:blur(2px);animation:fade .25s}
.dlg-in{padding:24px}
.dlg-in h2{font-size:18px;margin-bottom:8px}
.dlg-in p{color:var(--muted-2);margin-bottom:22px}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
// =====================================================================
//  FarmLine front end. Plain JavaScript, no build step.
//  Order: helpers, small UI components, sign in, app shell, farmer views, researcher views.
// =====================================================================
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = t => new Date(t * 1000).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
const fmtPhone = p => p && p.length === 10 ? `(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}` : (p || "");
const miles = (km, tail = "away") => km == null ? "" : `, ${Math.round(km * 0.621)} miles ${tail}`;
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const link = (url, text) => /^https?:/.test(url || "") ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);

const ICONS = {
  sprout: `<path d="M12 21V11"/><path d="M12 13c-4 0-6-2.500-6-6 4 0 6 2.500 6 6Z"/><path d="M12 10c0-4 2-6.500 6-6.500 0 4-2 6.500-6 6.500Z"/>`,
  search: `<circle cx="11" cy="11" r="6.500"/><path d="m20 20-4.300-4.300"/>`,
  pen: `<path d="M4 20h4L18.500 9.500a2.100 2.100 0 0 0-3-3L5 17v3Z"/><path d="m14 8 3 3"/>`,
  list: `<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.500 6h.01M4.500 12h.01M4.500 18h.01"/>`,
  mail: `<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7.500 8 5.500 8-5.500"/>`,
  user: `<circle cx="12" cy="8" r="3.500"/><path d="M5 20c.800-3.500 3.500-5 7-5s6.200 1.500 7 5"/>`,
  users: `<circle cx="9" cy="8" r="3.200"/><path d="M3 20c.600-3.200 2.900-4.800 6-4.800s5.400 1.600 6 4.800"/><path d="M16 5.200a3.200 3.200 0 0 1 0 5.800"/><path d="M18 15.600c1.700.600 2.700 2 3 4.400"/>`,
  clipboard: `<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 12h6M9 16h4"/>`,
  flask: `<path d="M9 3h6"/><path d="M10 3v6l-5 9a2 2 0 0 0 1.800 3h10.400A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.500 15h9"/>`,
  book: `<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>`,
  paper: `<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/>`,
  flag: `<path d="M5 21V4"/><path d="M5 4h12l-2.500 4 2.500 4H5"/>`,
  bulb: `<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.500 10.900c.600.500 1 1.300 1 2.100h5c0-.800.400-1.600 1-2.100A6 6 0 0 0 12 3Z"/>`,
  globe: `<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.500 2.600 3.800 5.600 3.800 9s-1.300 6.400-3.800 9c-2.500-2.600-3.800-5.600-3.800-9S9.500 5.600 12 3Z"/>`,
  idcard: `<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.200"/><path d="M5.500 16c.600-1.600 1.900-2.300 3.500-2.300s2.900.700 3.500 2.300"/><path d="M15 10h3.500M15 13.500h3.500"/>`,
  chev: `<path d="m6 9 6 6 6-6"/>`,
  check: `<path d="m5 12.500 4.500 4.500L19 7.500"/>`,
  phone: `<path d="M6 3h3l2 5-2.500 1.500a11 11 0 0 0 6 6L16 13l5 2v3a3 3 0 0 1-3 3A15 15 0 0 1 3 6a3 3 0 0 1 3-3Z"/>`,
  mic: `<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>`,
  stop: `<rect x="6.500" y="6.500" width="11" height="11" rx="2"/>`,
  send: `<path d="M21 3 10 14"/><path d="M21 3l-7 18-4-7-7-4 18-7Z"/>`,
  copy: `<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>`,
  ext: `<path d="M14 5h5v5"/><path d="M19 5l-8 8"/><path d="M11 7H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-5"/>`,
  spark: `<path d="M12 3l1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800L12 3Z"/><path d="M19 16v4M17 18h4"/>`,
  sun: `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400"/>`,
  moon: `<path d="M20 14.500A8 8 0 0 1 9.500 4 7 7 0 1 0 20 14.500Z"/>`,
  logout: `<path d="M10 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M15 8l4 4-4 4"/><path d="M19 12H9"/>`,
  plus: `<path d="M12 5v14M5 12h14"/>`,
  trash: `<path d="M5 7h14"/><path d="M10 7V4h4v3"/><path d="M7 7l1 13h8l1-13"/>`,
  alert: `<path d="M12 4 3 20h18L12 4Z"/><path d="M12 10v4"/><path d="M12 17.200v.100"/>`,
  inbox: `<path d="M4 13l2.500-8h11L20 13v6H4v-6Z"/><path d="M4 13h5l1 2.500h4l1-2.500h5"/>`,
};
const icon = (name, cls = "") => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ""}</svg>`;

// ---------- talking to the server ----------
async function api(path, body, method) {
  const opt = body !== undefined ? {method: method || "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body)} : {method: method || "GET", headers: {}};
  if (S.token) opt.headers.Authorization = "Bearer " + S.token;
  const stop = new AbortController(), timer = setTimeout(() => stop.abort(), 180000);
  let r;
  try { r = await fetch(path, {...opt, signal: stop.signal}); }
  catch (e) { throw new Error(stop.signal.aborted ? "This took more than three minutes and was stopped. Check the terminal where the app is running." : "Could not reach the app. Is it still running in the terminal?"); }
  finally { clearTimeout(timer); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Something went wrong. Try again.");
  return data;
}
const formData = f => Object.fromEntries([...new FormData(f).entries()].map(([k, v]) => [k, typeof v === "string" ? v.trim() : v]));

// ---------- form pieces ----------
const field = (name, label, value = "", o = {}) => `<div class="field"><label for="f_${name}">${label}${o.hint ? `<small>${o.hint}</small>` : ""}</label>${
  o.options ? `<select id="f_${name}" name="${name}">${o.options.map(x => `<option${x === value ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>`
  : o.area ? `<textarea id="f_${name}" name="${name}" placeholder="${esc(o.ph || "")}" ${o.req ? "required" : ""} ${o.rows ? `style="min-height:${o.rows * 26}px"` : ""}>${esc(value)}</textarea>`
  : `<input id="f_${name}" name="${name}" type="${o.type || "text"}" value="${esc(value)}" placeholder="${esc(o.ph || "")}" autocomplete="${o.auto || "off"}" ${o.req ? "required" : ""}>`}</div>`;

// Checks a form before it is sent and shows the problem under the field, opening a collapsed section if needed.
function validate(form) {
  let first = null;
  $$(".field.bad", form).forEach(f => { f.classList.remove("bad"); $(".field-err", f)?.remove(); });
  for (const el of $$("input, textarea", form)) {
    if (el.type === "hidden" || el.type === "checkbox") continue;
    let msg = "";
    if (el.required && !el.value.trim()) msg = "This one is needed.";
    else if (el.value && el.type === "email" && !el.checkValidity()) msg = "Enter a full email address.";
    else if (el.value && el.type === "url" && !el.checkValidity()) msg = "Enter a full web address, starting with https://";
    if (!msg) continue;
    const f = el.closest(".field");
    f.classList.add("bad"); f.insertAdjacentHTML("beforeend", `<p class="field-err">${msg}</p>`);
    first ||= el;
  }
  if (first) { const fold = first.closest("[data-fold]"); if (fold) setFold(fold, true); setTimeout(() => first.focus(), 60); }
  return !first;
}

// Runs an action from a form or button: shows a spinner on the button and any error right above it.
async function act(el, fn) {
  const box = el.closest("form, .item, .card") || el, btn = el.matches("button") ? el : $("button[type=submit]", el);
  $$(".error", box).forEach(x => x.remove());
  if (btn) { btn.disabled = true; btn.classList.add("busy"); }
  try { await fn(); }
  catch (e) { box.insertAdjacentHTML("afterbegin", `<div class="error" role="alert">${icon("alert")}<span>${esc(e.message)}</span></div>`); }
  if (btn && btn.isConnected) { btn.disabled = false; btn.classList.remove("busy"); }
}
function wireForm(form, onOk) {
  form.noValidate = true;
  form.onsubmit = e => { e.preventDefault(); if (validate(form)) act(form, () => onOk(formData(form))); };
}

// Animated menu on top of every real <select>. The select stays in the form, so nothing changes for the server.
function enhanceSelects(root = document) {
  $$("select:not([data-enh])", root).forEach(sel => {
    sel.dataset.enh = "1"; sel.tabIndex = -1; sel.setAttribute("aria-hidden", "true");
    const wrap = document.createElement("div"); wrap.className = "sel";
    sel.parentNode.insertBefore(wrap, sel); wrap.appendChild(sel);
    const btn = document.createElement("button"); btn.type = "button"; btn.className = "sel-btn"; btn.setAttribute("aria-haspopup", "listbox");
    const list = document.createElement("ul"); list.className = "sel-list"; list.setAttribute("role", "listbox");
    wrap.append(btn, list);
    const label = sel.id && document.querySelector(`label[for="${sel.id}"]`);
    if (label) { btn.id = sel.id + "_btn"; label.htmlFor = btn.id; }
    let active = sel.selectedIndex;
    const paint = () => {
      btn.innerHTML = `<span>${esc(sel.options[sel.selectedIndex]?.text || "")}</span>${icon("chev")}`;
      list.innerHTML = [...sel.options].map((o, i) => `<li role="option" data-i="${i}" aria-selected="${i === sel.selectedIndex}" class="${i === active ? "act" : ""}">${esc(o.text)}${i === sel.selectedIndex ? icon("check") : ""}</li>`).join("");
    };
    const open = on => { wrap.classList.toggle("open", on); btn.setAttribute("aria-expanded", on); if (on) { active = sel.selectedIndex; paint(); } };
    const pick = i => { sel.selectedIndex = i; sel.dispatchEvent(new Event("change", {bubbles: true})); open(false); btn.focus(); };
    btn.onclick = () => open(!wrap.classList.contains("open"));
    list.onclick = e => { const li = e.target.closest("li"); if (li) pick(+li.dataset.i); };
    list.onmousemove = e => { const li = e.target.closest("li"); if (li && +li.dataset.i !== active) { active = +li.dataset.i; paint(); } };
    btn.onkeydown = e => {
      const isOpen = wrap.classList.contains("open"), n = sel.options.length;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!isOpen) return open(true); active = (active + (e.key === "ArrowDown" ? 1 : n - 1)) % n; paint(); }
      else if ((e.key === "Enter" || e.key === " ") && isOpen) { e.preventDefault(); pick(active); }
      else if (e.key === "Escape" && isOpen) { e.stopPropagation(); open(false); }
    };
    sel.addEventListener("change", paint);
    wrap.addEventListener("focusout", e => { if (!wrap.contains(e.relatedTarget)) open(false); });
    paint();
  });
}

// ---------- small components ----------
const seg = (items, cur, label) => `<div class="seg" role="group" aria-label="${label}"><span class="seg-thumb"></span>${items.map(([v, t]) => `<button type="button" data-v="${v}" aria-pressed="${v === cur}">${t}</button>`).join("")}</div>`;
function wireSeg(el, onChange) {
  const thumb = $(".seg-thumb", el);
  const place = () => { const cur = $("[aria-pressed=true]", el); if (cur) { thumb.style.width = cur.offsetWidth + "px"; thumb.style.transform = `translateX(${cur.offsetLeft - 3}px)`; } };
  $$("button", el).forEach(b => b.onclick = () => { $$("button", el).forEach(x => x.setAttribute("aria-pressed", x === b)); place(); onChange(b.dataset.v); });
  thumb.style.transition = "none"; place();
  requestAnimationFrame(() => { place(); requestAnimationFrame(() => thumb.style.transition = ""); });
  document.fonts?.ready.then(place);

const KIND = {library: "article library", web: "web search", research: "research paper", article: "article", dataset: "dataset"};

// Counts seconds on a working section, so slow AI steps never look frozen.
function ticking(id) {
  const started = Date.now(), base = $(`#${id} .wait`)?.textContent || "";
  setStatus(id, "busy", "Working");
  const t = setInterval(() => {
    const el = $(`#${id} .wait`), secs = Math.round((Date.now() - started) / 1000);
    if (!el) return clearInterval(t);
    const chip = $(`#${id} .status .chip`); if (chip) chip.lastChild.textContent = `Working ${secs}s`;
    if (secs > 40) el.textContent = `${base} AI web search can take up to two minutes.`;
  }, 1000);
  return () => clearInterval(t);
}
function failed(id, e) { setBody(id, `<p class="alert">${esc(e.message || e)}</p>`); setStatus(id, "off", "Did not finish"); }
const liveOrSaved = (id, r, liveLabel, liveTip) => r.prepared
  ? setStatus(id, "saved", "Saved answer", "The live step did not finish this time, so the saved demo answer is shown.")
  : setStatus(id, "live", liveLabel, liveTip);

function loadResearchAndSolution(c) {
  const stops = ["research", "solution", "realcases", "experts"].map(ticking);
  loadExperts(c).catch(e => failed("experts", e)).finally(stops[3]);
  const research = loadResearch(c).catch(e => failed("research", e)).finally(stops[0]);
  research.then(() => loadSolution(c)).catch(e => failed("solution", e)).finally(stops[1]);
  loadRealCases(c).catch(e => failed("realcases", e)).finally(stops[2]);
}

// The drafted message shown under a person, with "open in email" and "copy".
function showDraft(box, k, hint) {
  const mail = `mailto:${encodeURIComponent(k.email)}?subject=${encodeURIComponent(k.subject)}&body=${encodeURIComponent(k.message)}`;
  box.insertAdjacentHTML("beforeend", `<div class="reveal">
    ${hint}

    <div class="btns"><a class="btn sm" href="${esc(mail)}">${icon("mail")}Open in my email app</a>
      <button class="btn ghost sm" data-copy>${icon("copy")}Copy message</button></div>
    <p class="small" style="margin-top:10px">If they join FarmLine with this email, your case will be waiting for them.</p></div>`);
  $("[data-copy]", box).onclick = () => { navigator.clipboard?.writeText(k.message); toast("Message copied"); };
}

async function loadSolution(c) {
  // the AI step: library articles + research abstracts + live web search
  const s = await api(`/api/cases/${c.id}/solution`, {}).catch(e => ({mode: "library", error: e.message}));
  if (!$("#solution")) return;
  s.sources = s.sources || []; s.steps = s.steps || [];
  const sources = s.sources.length ? `<div class="item" style="margin-top:18px;padding-top:18px;border-top:1px solid var(--border)"><h3>${s.mode === "ai" ? "Sources used" : "Related articles in the library"}</h3>
      ${s.sources.map(x => `<p>${link(x.url, x.title)} <span class="meta">(${KIND[x.kind] || x.kind})</span>${x.snippet ? `<br><span class="meta">${esc(x.snippet)}</span>` : ""}</p>`).join("")}</div>` : "";
  if (s.mode === "ai") {
    setBody("solution", `
      <ol class="steps">${s.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
      ${s.avoid ? `<p class="kv" style="margin-top:16px"><strong>Avoid:</strong> ${esc(s.avoid)}</p>` : ""}
      ${s.see_expert_if ? `<p class="kv"><strong>Get an expert if:</strong> ${esc(s.see_expert_if)}</p>` : ""}
      ${s.research_summary ? `<div class="sub" style="margin-top:16px"><strong>What the research says</strong><br>${esc(s.research_summary)}</div>` : ""}
      ${sources}
      ${s.prepared ? savedNote(s) : `<p class="foot">Written live by AI (${esc(s.engine || "")}) from ${plural(s.library_hits, "library article")}, ${plural(s.web_pages, "web page")} and the research papers below. It can be wrong. Confirm with an expert before treating.</p>`}`);
    liveOrSaved("solution", s, "Live AI", `Written live by ${s.engine || "AI"}`);
  } else {
    setBody("solution", `${s.error ? `<p class="alert">${esc(s.error)}</p>` : ""}
      ${sources || `<p class="muted">No article in the library matches this problem yet.</p>`}
      <p class="foot">${S.cfg.ai ? "" : "The AI key is not set, so FarmLine cannot write a solution from these or search the web yet. "}Library size: ${S.cfg.library ? S.cfg.library.documents : 0} articles and dataset entries.</p>`);
    setStatus("solution", "off", S.cfg.ai ? "Library only" : "Needs an AI key");
  }
}

async function loadResearch(c) {
  // research papers and the people who wrote them
  const r = await api(`/api/cases/${c.id}/research`);
  if (!$("#research")) return;
  const seen = new Set(), people = [];
  for (const p of (r.nearby || [])) { seen.add(p.profile_url); people.push({name: p.name, institution: p.institution, openalex_id: p.profile_url, paper_title: p.example_paper, note: `${p.papers_on_topic} papers on this${miles(p.km)}`}); }
  for (const p of (r.people || [])) if (!seen.has(p.openalex_id)) people.push({...p, note: `${plural(p.papers, "paper")} on this${p.country ? ", " + p.country : ""}`});
  r.papers = r.papers || [];
  if (!r.papers.length) { setBody("research", `<p class="muted">${esc(r.reason || "No papers found for “" + r.terms + "”.")}</p>`); return setStatus("research", "off", "Nothing found"); }
  setCount("research", r.papers.length);
  const body = setBody("research", `
    <p class="meta" style="margin:0 0 14px">${r.prepared ? "Saved list of papers on" : "From OpenAlex, an open database of research papers. Searched for"} “${esc(r.terms)}”.</p>
    <div class="stagger">${r.papers.map(p => `<div class="item"><h3>${link(p.url, p.title)}</h3>
      <p class="meta">${p.authors.length ? esc(p.authors.join(", ")) + (p.more_authors ? " and " + p.more_authors + " more. " : ". ") : ""}${esc(p.journal)}${p.journal ? ", " : ""}${p.year || ""}.${p.cited_by != null ? " Cited " + p.cited_by + " times." : ""}</p></div>`).join("")}</div>
    <div class="item" style="margin-top:18px;padding-top:18px;border-top:1px solid var(--border)"><h3>Researchers behind this work</h3>
      <p class="meta">They are not on FarmLine. Contact drafts an email to them about your case.</p>
      ${people.slice(0, 6).map((p, i) => `<div class="sub" data-person="${i}"><strong>${esc(p.name)}</strong>, ${esc(p.institution)}<br>
        <span class="meta">${esc(p.note)}${p.openalex_id ? ". " + link(p.openalex_id, "Research profile") : ""}${p.orcid ? ", " + link(p.orcid, "ORCID") : ""}${!p.openalex_id && p.paper_url ? ". " + link(p.paper_url, p.paper_title) : ""}</span>
        <p style="margin-top:10px"><button class="btn ghost sm" data-contact="${i}">${icon("mail")}Contact ${esc(p.name)}</button></p></div>`).join("")}
      ${r.prepared ? savedNote(r) : ""}</div>`);
  liveOrSaved("research", r, "Live search", "Searched live in OpenAlex");
  $$("[data-contact]", body).forEach(b => b.onclick = () => act(b, async () => {
    const p = people[b.dataset.contact], box = b.closest("[data-person]");

    b.parentElement.remove();
    showDraft(box, k, `${k.email ? `<p style="margin-bottom:10px">Email listed on their university page: <strong>${esc(k.email)}</strong>. Check it before sending.</p>`
        : `<p class="small" style="margin-bottom:10px">${k.looked_up ? "No public email found." : "Automatic lookup needs the AI key."} ${link(find, "Search for their contact page")}, then paste the address into the email.</p>`}

  }));

    : !list.length ? `<div class="card">${empty("list", "Nothing in this view", "Choose another filter to see your other requests.")}</div>`
    : list.map(c => `<div class="card" data-case="${c.id}">
      <div class="case-top"><div><h2 class="cap">${esc(c.crop)}</h2><p class="meta">Asked ${when(c.created)}${c.source === "phone" ? ", by phone" : ""}</p></div>
        <ul class="tags"><li class="${c.status === "solved" ? "good" : ""}">${c.status === "solved" ? "Solved" : "Open"}</li><li>${esc(c.category)}</li></ul></div>
      <p style="margin-top:12px">${esc(c.summary)}</p>
      ${c.requests.map(r => `<div class="reply-box">${r.kind === "farmer"
          ? `Your number was sent to <strong>${esc(r.name)}</strong>.`
          : r.status === "answered" ? `<strong>${esc(r.name)}, ${esc(r.institution)}</strong> ${REPLY[r.reply_type]}:<br>${esc(r.reply)}`
          : `Sent to <strong>${esc(r.name)}, ${esc(r.institution)}</strong>. <span class="muted">Waiting for a reply.</span>`}</div>`).join("")}
      ${c.status === "solved" ? `<p class="kv" style="margin-top:14px"><strong>What fixed it:</strong> ${esc(c.resolution)}</p>`
        : `<p style="margin-top:14px"><button class="btn ghost sm" data-solve>${icon("check")}Mark as solved</button></p>
           <form class="solve reveal" hidden><div class="field"><label for="s${c.id}">What fixed it?<small>so the next farmer can use it</small></label><textarea id="s${c.id}" name="what_worked" required style="min-height:84px"></textarea></div>
             <div class="btns"><button class="btn sm" type="submit">Save and share</button><button type="button" class="btn quiet sm" data-cancel>Cancel</button></div></form>`}
    </div>`).join("");
  $$("[data-go2]", box).forEach(b => b.onclick = () => go(b.dataset.go2));
  $$("[data-solve]", box).forEach(b => b.onclick = () => { const f = b.closest(".card").querySelector(".solve"); f.hidden = false; b.parentElement.hidden = true; $("textarea", f).focus(); });
  $$("[data-cancel]", box).forEach(b => b.onclick = () => { const f = b.closest(".solve"); f.hidden = true; $("textarea", f).value = ""; f.previousElementSibling.hidden = false; });
  $$(".solve", box).forEach(f => wireForm(f, async d => {
    await api(`/api/cases/${f.closest("[data-case]").dataset.case}/solve`, d); toast("Marked as solved and shared"); viewRequests(); }));
}

function wireProfile() {
  wireForm($("#profForm"), async d => { S.me = await api("/api/me", d, "PUT"); paintWho(); toast("Profile saved"); });
}
function viewFarmerProfile() {
  const me = S.me;
  main(`${pageHead("My profile", "Your contact details and where you farm. These fill in the Find help form for you.")}
    <form class="card" id="profForm" style="max-width:760px">
      ${detailsForm(me)}
      <div class="grid2">${field("crops", "Main crops", me.crops, {ph:"sorghum, cotton"})}${field("farm_acres", "Farm size in acres", me.farm_acres)}</div>
      <div class="grid2">${field("contact_pref", "Send my messages by", me.contact_pref || "text", {options:["text","email"]})}<div></div></div>
      <button class="btn" type="submit">Save profile</button>
    </form>`);
  wireProfile();
}

// =====================================================================
//  Researcher: Farmer cases, My trials, Article library, My profile
// =====================================================================
async function viewCases(refresh) {
  if (refresh !== true) loadingPage("Farmer cases");
  const list = await api("/api/researcher/cases"), sig = JSON.stringify(list.map(c => [c.id, c.status, c.request && c.request.status]));
  if (S.view !== "cases" || (refresh === true && sig === S.caseSig)) return;
  S.caseSig = sig; S.caseList = list;
  const n = {all: list.length, asked: list.filter(c => c.request && c.request.status !== "answered").length, answered: list.filter(c => c.request && c.request.status === "answered").length};
  main(`${pageHead("Farmer cases", "Cases farmers sent to you, and open cases that match your crops and research.",
      list.length ? seg([["all", `All<span class="count">${n.all}</span>`], ["asked", `Sent to you<span class="count">${n.asked}</span>`], ["answered", `Answered<span class="count">${n.answered}</span>`]], S.caseFilter, "Filter cases") : "")}
    <div id="caseList" class="stack"></div>`, refresh === true);
  if ($(".seg")) wireSeg($(".seg"), v => { S.caseFilter = v; paintCases(); });
  paintCases(refresh === true);
  if (refresh !== true) keepFresh(viewCases);
}
function paintCases(quiet) {
  const pick = {all: () => true, asked: c => c.request && c.request.status !== "answered", answered: c => c.request && c.request.status === "answered"}[S.caseFilter];
  const list = S.caseList.filter(pick), box = $("#caseList");
  box.className = "stack" + (quiet ? "" : " stagger");
  box.innerHTML = !S.caseList.length ? `<div class="card">${empty("clipboard", "No matching cases yet", "Add crops and topics to your profile so open cases can be matched to you.", `<button class="btn" data-go2="profile">Open my profile</button>`)}</div>`
    : !list.length ? `<div class="card">${empty("list", "Nothing in this view", "Choose another filter to see the other cases.")}</div>`
    : list.map(c => { const r = c.request, done = r && r.status === "answered"; return `<div class="card" data-case="${c.id}">
      <div class="case-top"><div><h2 class="cap">${esc(c.crop)}: ${esc(c.likely_issue && c.likely_issue !== "unclear" ? c.likely_issue : c.category + " problem")}</h2>
          <p class="meta">${esc(c.farmer)}, ${esc(c.place)}${miles(c.km, "from you")}, ${when(c.created)}</p></div>
        ${r && !done ? `<span class="chip live"><i class="dot"></i>Sent to you by the farmer</span>` : done ? `<span class="chip"><i class="dot"></i>Answered</span>` : ""}</div>
      <ul class="tags" style="margin-top:12px"><li class="${c.severity === "high" ? "hot" : ""}">${esc(c.severity)} severity</li>${c.started ? `<li>started: ${esc(c.started.toLowerCase())}</li>` : ""}${c.area_affected ? `<li>affected: ${esc(c.area_affected.toLowerCase())}</li>` : ""}
        ${c.trial_ok ? `<li class="good">Open to a field trial</li>` : ""}</ul>
      <p style="margin-top:12px">${esc(c.summary)}</p>
      <p class="quote" style="margin-top:10px">${esc(c.description)}</p>
      ${c.similar ? `<p class="alert small" style="margin-top:10px">${c.similar} other ${esc(c.crop)} ${esc(c.category)} report${c.similar > 1 ? "s" : ""} in the last 30 days.</p>` : ""}
      ${done ? `<div class="reply-box"><strong>Your reply (${esc(r.reply_type)}):</strong><br>${esc(r.reply)}</div>`
        : `<p style="margin-top:14px"><button class="btn sm" data-open-reply>${icon("pen")}Write a reply</button></p>
           <form class="reply reveal" hidden>
             <div class="grid2"><div class="field"><label for="t${c.id}">Reply type</label><select id="t${c.id}" name="reply_type"><option value="advice">Give advice</option><option value="trial">Offer to test a solution on this field</option><option value="visit">Ask for a visit or sample</option></select></div><div></div></div>
             <div class="field"><label for="m${c.id}">Message to the farmer<small>plain words, sent by text or email</small></label><textarea id="m${c.id}" name="message" required style="min-height:96px"></textarea></div>
             <div class="btns"><button class="btn sm" type="submit">${icon("send")}Send reply</button><button type="button" class="btn quiet sm" data-cancel>Cancel</button></div></form>`}
    </div>`; }).join("");
  enhanceSelects(box);
  $$("[data-go2]", box).forEach(b => b.onclick = () => go(b.dataset.go2));
  $$("[data-open-reply]", box).forEach(b => b.onclick = () => { const f = b.closest(".card").querySelector(".reply"); f.hidden = false; b.parentElement.hidden = true; $("textarea", f).focus(); });
  $$("[data-cancel]", box).forEach(b => b.onclick = () => { const f = b.closest(".reply"); f.hidden = true; $("textarea", f).value = ""; f.previousElementSibling.hidden = false; });
  $$(".reply", box).forEach(f => wireForm(f, async d => {
    await api(`/api/cases/${f.closest("[data-case]").dataset.case}/reply`, d); toast("Reply sent to the farmer"); viewCases(); }));
}

function viewTrials() {
  main(`${pageHead("My trials", "Solutions you want to test on real farms. Farmers with a matching problem see them next to your name.")}
  <div class="cols wide-left">
    <form class="card" id="trialForm">
      <div class="card-head"><h2>A solution you want to test</h2></div>
      ${field("title", "Title", "", {req:1, ph:"Aphid-tolerant sorghum strips"})}
      <div class="grid2">${field("crop", "Crop", "", {req:1})}${field("problem", "Problem it targets", "", {req:1, ph:"Sugarcane aphid"})}</div>
      ${field("description", "What you are testing", "", {area:1, rows:3, ph:"One or two plain sentences a farmer can follow."})}
      ${field("farmer_needs", "What the farmer would need to do", "", {area:1, rows:3, ph:"Land, time, visits, photos."})}
      <button class="btn" type="submit">${icon("plus")}Add trial</button>
    </form>
    <div class="card"><div class="card-head"><h2>Your trials</h2><span class="count" id="nTrials" hidden></span></div><div id="tlist">${skeleton(3)}</div></div>
  </div>`);
  const load = async () => {
    const list = await api("/api/researcher/trials");
    $("#nTrials").hidden = !list.length; $("#nTrials").textContent = list.length;
    $("#tlist").innerHTML = list.length ? `<div class="stagger">${list.map(t => `<div class="item"><h3>${esc(t.title)}</h3>
      <p class="meta cap">${esc(t.crop)}, targets ${esc(t.problem)}</p><p>${esc(t.description)}</p>
      ${t.farmer_needs ? `<p class="muted">Farmer needs to: ${esc(t.farmer_needs)}</p>` : ""}
      <p><button class="btn quiet sm" data-del="${t.id}" data-title="${esc(t.title)}">${icon("trash")}Remove</button></p></div>`).join("")}</div>`
      : empty("flask", "No trials yet", "Add a solution you want to test and it will be shown to farmers it could help.");
    $$("[data-del]").forEach(b => b.onclick = async () => {
      if (!await confirmBox({title: "Remove this trial?", body: `“${b.dataset.title}” will no longer be shown to farmers.`, yes: "Remove trial"})) return;
      await api(`/api/researcher/trials/${b.dataset.del}`, undefined, "DELETE"); toast("Trial removed"); load();
    });
  };
  load();
  wireForm($("#trialForm"), async d => { await api("/api/researcher/trials", d); $("#trialForm").reset(); load(); toast("Trial added"); });
}

function viewArticles() {
  main(`${pageHead("Article library", "Factsheets, extension guides and papers that FarmLine reads to write suggested solutions for farmers.")}
  <div class="cols wide-left">
    <form class="card" id="artForm">
      <div class="card-head"><h2>Add an article</h2></div>
      ${field("url", "Web address of a page or PDF", "", {type:"url", req:1, ph:"https://extension.example.edu/factsheet"})}
      <button class="btn" type="submit">${icon("plus")}Add to library</button>
      <p class="small" style="margin-top:14px">FarmLine reads the page once and keeps the text on this server. It skips pages a site asks robots not to read.</p>
    </form>
    <div class="card"><div class="card-head"><h2>In the library</h2><span class="count" id="nArt" hidden></span></div><div id="artList">${skeleton(4)}</div></div>
  </div>`);
  const load = async () => {
    const r = await api("/api/library");
    $("#nArt").hidden = false; $("#nArt").textContent = r.stats.documents;
    $("#artList").innerHTML = (r.stats.by_kind.dataset ? `<p class="meta" style="margin-bottom:12px">Includes ${r.stats.by_kind.dataset} entries from datasets.</p>` : "")
      + (r.recent.length ? `<div class="stagger">${r.recent.map(d => `<div class="item"><h3>${link(d.url, d.title)}</h3>
      <p class="meta">${esc(d.source)}, ${d.words} words, ${d.kind === "web" ? "found by web search" : "added"} ${when(d.created)}</p></div>`).join("")}</div>`
      : empty("book", "No articles yet", "Add one here, or list web addresses in sources.txt."));
  };
  load();
  wireForm($("#artForm"), async d => { const r = await api("/api/library", d); $("#artForm").reset(); toast(`Added. ${r.words} words read.`); load(); });
}

function viewResearcherProfile() {
  const me = S.me;
  main(`${pageHead("My profile", "What you study and where. FarmLine uses this to send you the right cases.")}
    <form class="card" id="profForm" style="max-width:760px">
      ${field("name", "Full name", me.name, {req:1})}
      <div class="grid2">${field("email", "Email", me.email, {type:"email", req:1})}${field("phone", "Phone number", fmtPhone(me.phone), {type:"tel", hint:"optional"})}</div>
      <div class="grid2">${field("institution", "University", me.institution, {req:1})}${field("department", "Department", me.department)}</div>
      ${field("expertise", "What you study", me.expertise, {area:1, rows:3, hint:"separate topics with commas"})}
      ${field("crops", "Crops you work on", me.crops, {hint:"separate with commas"})}
      <div class="grid3">${field("city", "City", me.city)}${field("state", "State", me.state)}${field("zip", "ZIP code", me.zip)}</div>
      <div class="grid2">${field("contact_pref", "Send new cases to me by", me.contact_pref || "email", {options:["email","text"]})}<div></div></div>
      <button class="btn" type="submit">Save profile</button>
    </form>`);
  wireProfile();
}

const VIEWS = {
  farmer: {help: viewHelp, share: viewShare, requests: viewRequests, messages: viewMessages, profile: viewFarmerProfile},
  researcher: {cases: viewCases, trials: viewTrials, articles: viewArticles, messages: viewMessages, profile: viewResearcherProfile},
};

  S.cfg = await api("/api/config").catch(() => ({}));
  try { if (!S.token) throw 0; S.me = await api("/api/me"); startInbox(); go(NAV[S.me.role][0][0]); } catch { S.token = null; renderAuth(); }
})();
